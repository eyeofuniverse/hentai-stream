name: Daily report email

# Emails the site owner a summary of the LAST COMPLETE day (Asia/Dhaka) — revenue,
# new content, reports, traffic. GitHub cron is routinely late, and a run that
# starts after midnight used to email the new, nearly empty day; the script now
# always reports yesterday relative to when it starts, so lateness doesn't
# matter. It is scheduled just after Bangladesh midnight so the day is finished
# (and ExoClick's figures, requested in Asia/Dhaka, are complete) even on a
# punctual run. See scripts/daily-report.mts.
#
# Repo secrets: DATABASE_URL, DIRECT_URL, RESEND_API_KEY, EXOCLICK_SITE_ID
# (the ExoClick call re-authenticates itself off the refresh_token already
# cached in the SocialToken table — no EXOCLICK_USERNAME/PASSWORD needed
# here, and 2FA on that account means a bare username/password login
# wouldn't work unattended anyway; see src/lib/exoclick.ts)

on:
  schedule:
    - cron: "30 18 * * *" # 00:30 Asia/Dhaka (UTC+6) — reports the day that just ended
  workflow_dispatch:
    inputs:
      date:
        description: "day to report, YYYY-MM-DD in Asia/Dhaka (blank = yesterday)"
        required: false
        default: ""

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write .env
        run: |
          {
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            echo "DB_RETRY_ATTEMPTS=12"
            echo "DIRECT_URL=${{ secrets.DIRECT_URL }}"
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}"
            echo "EXOCLICK_SITE_ID=${{ secrets.EXOCLICK_SITE_ID }}"
          } > .env
      - run: npx prisma generate
      - name: Send daily report
        env:
          REPORT_DATE: ${{ github.event.inputs.date }}
        run: npm run daily-report
