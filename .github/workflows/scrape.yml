name: Scrape video sources

# Pulls episode embed links from a source site and attaches them to matched
# series (auto-publishing + spot-check per the ingest rules). Runs on a US
# runner, straight against the DB.
#
# Repo secrets: DATABASE_URL, DIRECT_URL, MAL_CLIENT_ID (title fallback search)

on:
  workflow_dispatch:
    inputs:
      site:
        description: "watchhentai | hentaimama | hentaigasm | miohentai | hentaila"
        required: true
        default: "hentaigasm"
      mode:
        description: "crawl (whole site) | topup (our series missing video) | repair (re-fetch dead source URLs)"
        required: true
        default: "crawl"
      limit:
        description: "stop after N episode records (blank = no limit)"
        required: false
        default: ""
      refetch:
        description: "re-fetch sources for episodes we already have (refresh rotated CDN URLs)"
        type: boolean
        default: false
      dry_run:
        description: "match + report only, write nothing"
        type: boolean
        default: false
  schedule:
    - cron: "40 3 * * *" # daily 03:40 UTC — incremental, skips episodes we have

concurrency:
  group: scrape-${{ github.event.inputs.site || 'hentaigasm' }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write .env
        run: |
          {
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            echo "DB_RETRY_ATTEMPTS=12"
            echo "DIRECT_URL=${{ secrets.DIRECT_URL }}"
            echo "MAL_CLIENT_ID=${{ secrets.MAL_CLIENT_ID }}"
            echo "BUNNY_STREAM_LIBRARY_ID=${{ secrets.BUNNY_STREAM_LIBRARY_ID }}"
            echo "BUNNY_STREAM_API_KEY=${{ secrets.BUNNY_STREAM_API_KEY }}"
            echo "NEXT_PUBLIC_BUNNY_CDN_HOST=${{ secrets.BUNNY_STREAM_CDN_HOST }}"
            echo "NEXT_PUBLIC_SITE_URL=${{ secrets.SITE_URL }}"
            echo "INDEXNOW_KEY=${{ secrets.INDEXNOW_KEY }}"
          } > .env
      - run: npx prisma generate
      - name: Scrape
        run: |
          SITE="${{ github.event.inputs.site || 'hentaigasm' }}"
          MODE="${{ github.event.inputs.mode || 'crawl' }}"
          REFETCH="${{ github.event.inputs.refetch }}"

          # scheduled runs rotate the source site by weekday so every one gets a
          # regular crawl, not only hentaigasm
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$(date -u +%u)" in
              2|4|6|7) SITE=watchhentai ;;
              *)       SITE=hentaigasm ;;
            esac
            MODE=crawl
          fi

          ARGS="--site=$SITE --mode=$MODE"
          [ -n "${{ github.event.inputs.limit }}" ] && ARGS="$ARGS --limit=${{ github.event.inputs.limit }}"
          [ "$REFETCH" = "true" ] && ARGS="$ARGS --refetch"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          echo "npm run scrape -- $ARGS"
          npm run scrape -- $ARGS

      - name: Verify sources
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: npm run verify

      - name: Queue new episodes into Bunny
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: npm run migrate

      - name: Ping IndexNow with what changed
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: npm run indexnow -- --hours=26
