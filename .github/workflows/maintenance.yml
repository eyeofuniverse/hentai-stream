name: Catalogue maintenance

# The light, bounded housekeeping that keeps the catalogue healthy — separate
# from the heavy site crawl (scrape.yml) so neither blocks the other:
#   drain     — re-resolve the /admin/unmatched queue (map or bare-create)
#   topup     — find video for series that still have none (rotates source site)
#   repair    — re-fetch fresh URLs for episodes whose only sources went DEAD
#   covers    — anilist enrich, coverless series first (no gradient blocks)
#   verify    — re-check playability, publish/unpublish
#   migrate   — queue newly-playable episodes into Bunny
#   reconcile — delete Bunny videos no episode references (orphans from a
#               killed host job) and any still-failed video left behind
#   recompute — weeklyViews / bayesianRating / trendingScore
#   cleanup   — prune PageVisit/AdminLoginAttempt/IpGeoCache past retention,
#               junk SearchTermStat rows
#   repair-thumbs — re-copy a small batch of dead episode thumbnails from
#               Bunny each night (bounded batch — see the script's own
#               comment for why this can't just be one big sweep)
#
# Repo secrets: DATABASE_URL, DIRECT_URL, MAL_CLIENT_ID, BUNNY_STREAM_*

on:
  schedule:
    - cron: "30 13 * * *" # daily 13:30 UTC (well clear of the 03:40 crawl)
  workflow_dispatch:
    inputs:
      skip_topup:
        type: boolean
        default: false

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write .env
        run: |
          {
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            echo "DB_RETRY_ATTEMPTS=12"
            echo "DIRECT_URL=${{ secrets.DIRECT_URL }}"
            echo "MAL_CLIENT_ID=${{ secrets.MAL_CLIENT_ID }}"
            echo "BUNNY_STREAM_LIBRARY_ID=${{ secrets.BUNNY_STREAM_LIBRARY_ID }}"
            echo "BUNNY_STREAM_API_KEY=${{ secrets.BUNNY_STREAM_API_KEY }}"
            echo "NEXT_PUBLIC_BUNNY_CDN_HOST=${{ secrets.BUNNY_STREAM_CDN_HOST }}"
            echo "NEXT_PUBLIC_SITE_URL=${{ secrets.SITE_URL }}"
            echo "INDEXNOW_KEY=${{ secrets.INDEXNOW_KEY }}"
          } > .env
      - run: npx prisma generate

      - name: Drain unmatched queue
        continue-on-error: true
        run: npm run unmatched:drain -- --limit=150

      - name: Topup — series still missing video
        if: ${{ github.event.inputs.skip_topup != 'true' }}
        continue-on-error: true
        run: |
          case "$(date -u +%u)" in
            2|4|6) SITE=watchhentai ;;
            *)     SITE=hentaigasm ;;
          esac
          npm run scrape -- --site=$SITE --mode=topup --limit=200

      - name: Repair — re-fetch DEAD source URLs
        continue-on-error: true
        run: |
          case "$(date -u +%u)" in
            2|4|6) SITE=watchhentai ;;
            *)     SITE=hentaigasm ;;
          esac
          npm run scrape -- --site=$SITE --mode=repair --limit=150

      - name: Covers + metadata — anilist (coverless first)
        continue-on-error: true
        run: npm run enrich -- --source=anilist --limit=250

      - name: Verify
        continue-on-error: true
        run: npm run verify

      - name: Migrate playable episodes into Bunny
        continue-on-error: true
        run: npm run migrate -- --retry

      - name: Reconcile — delete orphaned/failed Bunny videos
        continue-on-error: true
        run: npm run reconcile-bunny

      - name: Recompute derived metrics
        continue-on-error: true
        run: npm run recompute

      - name: Retention cleanup — prune old PageVisit/AdminLoginAttempt/IpGeoCache/junk search terms
        continue-on-error: true
        run: npm run cleanup

      - name: Repair a small batch of dead episode thumbnails
        continue-on-error: true
        run: npm run repair-thumbs

      - name: Ping IndexNow with what changed
        continue-on-error: true
        run: npm run indexnow -- --hours=26
