name: Weekly metadata sync

# Pulls new hentai releases from MyAnimeList into the catalogue.
# Needs two repo secrets:
#   SITE_URL      e.g. https://yourdomain.com   (no trailing slash)
#   CRON_SECRET   the same value as in the app env

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger metadata sync
        run: |
          curl -sS --fail-with-body -m 320 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/metadata?mode=weekly" | tee result.json
