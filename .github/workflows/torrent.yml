name: Grab from torrent

# Downloads missing episodes from sukebei.nyaa.si, uploads them to Bunny.
#   - manual dispatch: held in /admin/review by default
#   - weekly schedule: auto-publishes once Bunny transcodes (successful transcode
#     proves it's a real video); wrong episode/lang is rare and reportable
#
# Repo secrets: DATABASE_URL, DIRECT_URL, BUNNY_STREAM_*

on:
  workflow_dispatch:
    inputs:
      series:
        description: "one series slug (blank = use the wanted list)"
        required: false
        default: ""
      limit:
        description: "how many series from the wanted list"
        required: false
        default: "3"
      min_seeders:
        description: "skip torrents below this seeder count"
        required: false
        default: "2"
      max_size:
        description: "skip torrents bigger than this (GiB)"
        required: false
        default: "6"
      review:
        description: "hold grabbed episodes in the review queue"
        type: boolean
        default: true
      dry_run:
        description: "search + report only, download nothing"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 0,3" # Sun + Wed 06:00 UTC — fill gaps, auto-publish

concurrency:
  group: torrent-grab
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y aria2
      - run: npm ci
      - name: Write .env
        run: |
          {
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            echo "DB_RETRY_ATTEMPTS=12"
            echo "DIRECT_URL=${{ secrets.DIRECT_URL }}"
            echo "BUNNY_STREAM_LIBRARY_ID=${{ secrets.BUNNY_STREAM_LIBRARY_ID }}"
            echo "BUNNY_STREAM_API_KEY=${{ secrets.BUNNY_STREAM_API_KEY }}"
            echo "NEXT_PUBLIC_BUNNY_CDN_HOST=${{ secrets.BUNNY_STREAM_CDN_HOST }}"
          } > .env
      - run: npx prisma generate
      - name: Grab
        run: |
          DIR="$RUNNER_TEMP/torrents"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npm run torrent -- --dir="$DIR" --wanted --limit=12 --min-seeders=3 --max-size=6 --no-review
          else
            ARGS="--dir=$DIR"
            if [ -n "${{ github.event.inputs.series }}" ]; then
              ARGS="$ARGS --series=${{ github.event.inputs.series }}"
            else
              ARGS="$ARGS --wanted --limit=${{ github.event.inputs.limit }}"
            fi
            ARGS="$ARGS --min-seeders=${{ github.event.inputs.min_seeders }} --max-size=${{ github.event.inputs.max_size }}"
            [ "${{ github.event.inputs.review }}" = "false" ] && ARGS="$ARGS --no-review"
            [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
            npm run torrent -- $ARGS
          fi
      - name: Poll Bunny transcodes
        if: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run != 'true' }}
        run: npm run migrate -- --poll-only
      - name: Clean scratch
        if: always()
        run: rm -rf "$RUNNER_TEMP/torrents"
