name: Migrate raw-URL covers to R2 (one-off)

# One-time cleanup: some Series.coverUrl/bannerUrl rows still store a raw
# external URL (an earlier enrich upload failed and fell back to hotlinking
# the source instead of R2 — see scripts/migrate-http-covers-r2.mts). Runs on
# a US GitHub runner for reliable DB/R2 connectivity.
#
# Run it: repo → Actions → "Migrate raw-URL covers to R2 (one-off)" → Run workflow.
#
# Needs these repo secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL, DIRECT_URL, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
#   R2_SECRET_ACCESS_KEY, R2_BUCKET — same values as the app env.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max series to process (blank = all)"
        required: false
        default: ""

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write .env
        run: |
          {
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            echo "DB_RETRY_ATTEMPTS=12"
            echo "DIRECT_URL=${{ secrets.DIRECT_URL }}"
            echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}"
            echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}"
            echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}"
            echo "R2_BUCKET=${{ secrets.R2_BUCKET }}"
          } > .env

      - run: npx prisma generate

      - name: Run migration
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="--limit=${{ inputs.limit }}"; fi
          npx tsx --env-file=.env scripts/migrate-http-covers-r2.mts $ARGS
